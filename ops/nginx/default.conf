upstream devflow_backend {
  server backend:8000;
}

upstream devflow_frontend {
  server frontend:3000;
}

server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://devflow_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://devflow_frontend;
  }
}
