name: Task
description: Create a development task
title: "[Task]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Create a specific development task
  
  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: What needs to be done?
    validations:
      required: true
  
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know this is complete?
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
        - [ ] Criteria 3
    validations:
      required: true
  
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Frontend - UI Component
        - Frontend - Page/Route
        - Frontend - State Management
        - Backend - API Endpoint
        - Backend - Database
        - Backend - Authentication
        - DevOps - CI/CD
        - Documentation
        - Testing
    validations:
      required: true
  
  - type: input
    id: estimate
    attributes:
      label: Time Estimate
      description: How long will this take?
      placeholder: "e.g., 2 hours, 1 day, 3 days"
  
  - type: textarea
    id: notes
    attributes:
      label: Technical Notes
      description: Any implementation details or considerations