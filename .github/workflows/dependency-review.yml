# .github/workflows/dependency-review.yml
#
# Dependency Security Review Workflow
#
# This workflow uses `cargo-audit` to scan the project's dependencies
# for known security vulnerabilities. It runs on every pull request
# to prevent insecure dependencies from being merged.

name: Dependency Review

on:
  pull_request:
    branches: [ "main" ]

jobs:
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit
        working-directory: ./backend
